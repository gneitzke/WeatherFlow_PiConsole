name: tests

on:
  push:
    branches: [feature/almanac-ux, main]
  pull_request:
    branches: [feature/almanac-ux, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]   # matches the Pi (3.11.2)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history so the mergeability guard can diff

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Add upstream remote for the mergeability guard
        run: |
          git remote add upstream https://github.com/peted-davis/WeatherFlow_PiConsole.git
          git fetch --depth=1 upstream main

      - name: Run tests
        env:
          PICONSOLE_UPSTREAM_REF: upstream/main
        run: pytest
